services:
  # ===========================================
  # Nomad (single container — API + frontend)
  # ===========================================
  # In SAN mode the backend serves the built frontend (same-origin).
  # No separate frontend container or nginx proxy needed.
  nomad:
    container_name: nomad
    # #465: CI publishes this image on release and deploy.sh pulls it, so the
    # artefact that serves production is the artefact CI tested. The build
    # block stays for offline installs (`deploy.sh --build-local`), which
    # genuinely need it, and tags the result with this same name.
    image: ${NOMAD_APP_IMAGE:-ghcr.io/wise-developers/project_nomad/nomad:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
        - VITE_AUTH_MODE=${VITE_AUTH_MODE:-simple}
    ports:
      - "${NOMAD_FRONTEND_HOST_PORT}:3001"
      # MCP, published on HOST LOOPBACK ONLY so `ssh -L 3002:127.0.0.1:3002` can reach it.
      #
      # MCP binds 127.0.0.1 INSIDE the container, so without this line it was reachable
      # only by `docker exec` — an SSH tunnel terminates on the host and nothing bridged
      # the two. The design doc's claim that it was "reachable only through an SSH tunnel"
      # was never true as built.
      #
      # THE 127.0.0.1 IS DELIBERATELY A LITERAL, NOT A VARIABLE. cloudflared's ingress is
      # whole-host with no path filter (it names http://localhost:53000 and 404s the rest),
      # so the only things keeping MCP off the public internet are that its port is not the
      # routed one and that it is not bound to 0.0.0.0. A substitutable bind address would
      # let one .env typo publish `execute-model` and `batch-execute` to every interface.
      # scripts/__tests__/mcp_port_loopback_only.test.sh fails if this is widened.
      #
      # Harmless when MCP is off: nothing listens inside the container, so the publish is
      # an unused loopback mapping.
      - "127.0.0.1:${NOMAD_MCP_PORT:-3002}:${NOMAD_MCP_PORT:-3002}"
    volumes:
      # WARNING: Docker socket mount - see Security Considerations in README
      - /var/run/docker.sock:/var/run/docker.sock
      # FireSTARR dataset - same mount as firestarr-app for fuel grids + sims
      - ${FIRESTARR_DATASET_PATH}:/appl/data
      # Mount compose files so backend can spawn FireSTARR containers
      - ./docker-compose.yaml:/app/docker-compose.yaml:ro
      - ./.env:/app/.env:ro
      - ./.env:/app/host.env:ro
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Override to use container path (not host relative path from .env)
      - FIRESTARR_DATASET_PATH=/appl/data
      - NOMAD_DATA_PATH=/appl/data
      # Authentication mode for SAN (none|simple|oauth)
      - NOMAD_AUTH_MODE=${NOMAD_AUTH_MODE:-simple}
      - VITE_AUTH_MODE=${VITE_AUTH_MODE:-simple}
    env_file:
      - .env
    restart: unless-stopped

  # ===========================================
  # FireSTARR Model Engine
  # ===========================================
  # NOTE: This service is NOT started with `docker compose up`.
  # It's a template used by `docker compose run firestarr-app <command>`.
  # The backend's DockerExecutor spawns ephemeral containers for each job.
  firestarr-app:
    image: ${FIRESTARR_IMAGE:?FIRESTARR_IMAGE must be set in .env - run the installer}
    profiles: ["modeling"]  # Prevents auto-start with `docker compose up`
    # No entrypoint override (#515). RASTER_ROOT is baked into settings.ini when the image
    # is built (build-firestarr.yml), so nothing needs rewriting per run and the image's own
    # ENTRYPOINT — the firestarr binary — is used directly.
    #
    # This previously wrapped the entrypoint in /bin/sh to run one sed. That made docker mode
    # require a shell inside whatever FIRESTARR_IMAGE names, and that image is
    # operator-supplied with no default, so an image built on a minimal base failed at run
    # time with an exec error that reads like a broken container.
    #
    # NOTE for an image NOT built by build-firestarr.yml: it carries its own settings.ini,
    # whose RASTER_ROOT is relative in the upstream tarball. If you point FIRESTARR_IMAGE at
    # such an image, mount a prepared settings.ini over /appl/firestarr/settings.ini rather
    # than reinstating a shell here.
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs
      - ${FIRESTARR_DATASET_PATH}:/appl/data
      - ${FIRESTARR_DATASET_PATH}/sims:/appl/data/sims
