name: Dev Pre-Release

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  dev-prerelease:
    runs-on: ubuntu-latest
    # Loop guard. This job pushes a bump commit to dev with a PAT, and a PAT
    # push DOES re-trigger workflows, so without a guard it would run forever.
    #
    # The guard is on the commit MESSAGE, not on github.actor. The old actor
    # check was unsound: these commits are *authored* as github-actions[bot]
    # because of the git config below, but github.actor on a PAT-triggered push
    # is the token owner, not the bot. Author and actor are different things.
    #
    # The marker is deliberately NOT `[skip ci]`. GitHub acts on that natively
    # and suppresses every workflow for the commit, which left dev's head with
    # zero check runs and blocked required checks on dev -> main PRs (#333).
    # `[release-bot]` means nothing to GitHub, so CI still runs. Same pattern
    # stable-release.yml already uses.
    if: "!contains(github.event.head_commit.message, '[release-bot]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bump patch version
        id: version
        run: |
          # Every change on dev bumps PATCH (#348). The patch digit counts the
          # changes accumulated on the current line: 0.5.13 means thirteen
          # changes since 0.5.0. Merging to main then bumps MINOR, which is the
          # release.
          PREVIOUS=$(node -p "require('./frontend/package.json').version")
          chmod +x .github/scripts/bump-version.sh
          NEW_VERSION=$(.github/scripts/bump-version.sh patch)
          echo "previous=${PREVIOUS}" >> $GITHUB_OUTPUT
          echo "current=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Dev version: v${PREVIOUS} -> v${NEW_VERSION}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # All three package.json files, not just the frontend (#442), AND the
          # root lockfile: bump-version.sh writes it, so a workflow that does not
          # stage it commits the bump and drops the lockfile change. That happened
          # on dev v0.28.11 — package.json 0.28.11 against lock 0.28.10.
          # bump-version.sh writes all three; staging only one committed a
          # partial bump and left root/backend drifting again — which is the
          # exact state #442 fixed, reintroduced one layer up.
          git add package.json backend/package.json frontend/package.json package-lock.json
          git commit -m "chore: dev v${{ steps.version.outputs.current }} [release-bot]"
          git push

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build library and pack tarball
        run: npm run build:lib && npm pack
        working-directory: frontend

      - name: Rename tarball with dev tag
        working-directory: frontend
        run: mv nomad-frontend-*.tgz "nomad-frontend-${{ steps.version.outputs.tag }}.tgz"

      - name: Generate SBOM
        # Software bill of materials for the release (#398). Derived from
        # package-lock.json at THIS commit by `npm sbom`, so it describes the
        # tree that was actually tagged — GitHub's dependency-graph export
        # describes whatever it last indexed, which is not the same thing.
        #
        # The version is passed in because `npm sbom` names the document after
        # the ROOT package.json. Since #442 that file IS bumped, so this is now
        # belt-and-braces rather than load-bearing — but it stays: the document
        # must name the release even if the two ever diverge again.
        run: |
          chmod +x .github/scripts/generate-sbom.sh
          .github/scripts/generate-sbom.sh "${{ steps.version.outputs.current }}" "nomad-sbom-${{ steps.version.outputs.current }}.spdx.json"

      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ steps.version.outputs.tag }} (unstable)"
          prerelease: true
          generate_release_notes: true
          files: |
            frontend/nomad-frontend-*.tgz
            nomad-sbom-*.spdx.json
          body: |
            **Unstable pre-release** — not for production use.

            Branch: `dev`
            Version: `v${{ steps.version.outputs.current }}` (was `v${{ steps.version.outputs.previous }}`)
            Commit: `${{ github.sha }}`
