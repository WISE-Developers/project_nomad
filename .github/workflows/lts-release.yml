name: LTS Release

on:
  pull_request:
    branches: [lts]
    types: [closed]

permissions:
  contents: write

jobs:
  lts-release:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'main'

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply patch bump
        id: newversion
        run: |
          chmod +x .github/scripts/bump-version.sh
          NEW_VERSION=$(.github/scripts/bump-version.sh patch)
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}-lts" >> $GITHUB_OUTPUT
          echo "LTS version: v${NEW_VERSION}-lts"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # All three package.json files, not just the frontend (#442), AND the
          # root lockfile: bump-version.sh writes it, so a workflow that does not
          # stage it commits the bump and drops the lockfile change. That happened
          # on dev v0.28.11 — package.json 0.28.11 against lock 0.28.10.
          # bump-version.sh writes all three; staging only one committed a
          # partial bump and left root/backend drifting again — which is the
          # exact state #442 fixed, reintroduced one layer up.
          git add package.json backend/package.json frontend/package.json package-lock.json
          git commit -m "chore: bump to v${{ steps.newversion.outputs.version }}-lts [release-bot]"
          git pull --rebase origin lts
          git push

      - name: Create git tag
        run: |
          git tag "${{ steps.newversion.outputs.tag }}"
          git push origin "${{ steps.newversion.outputs.tag }}"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build library and pack tarball
        run: npm run build:lib && npm pack
        working-directory: frontend

      - name: Generate SBOM
        # Software bill of materials for the release (#398). Derived from
        # package-lock.json at THIS commit by `npm sbom`, so it describes the
        # tree that was actually tagged — GitHub's dependency-graph export
        # describes whatever it last indexed, which is not the same thing.
        #
        # The version is passed in because `npm sbom` names the document after
        # the ROOT package.json. Since #442 that file IS bumped, so this is now
        # belt-and-braces rather than load-bearing — but it stays: the document
        # must name the release even if the two ever diverge again.
        run: |
          chmod +x .github/scripts/generate-sbom.sh
          .github/scripts/generate-sbom.sh "${{ steps.newversion.outputs.version }}" "nomad-sbom-${{ steps.newversion.outputs.version }}.spdx.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.newversion.outputs.tag }}
          name: "v${{ steps.newversion.outputs.version }} (LTS)"
          prerelease: false
          generate_release_notes: true
          files: |
            frontend/nomad-frontend-*.tgz
            nomad-sbom-*.spdx.json
          body: |
            **LTS release** — long-term support channel.

            Promoted from `main` at `v${{ steps.newversion.outputs.version }}`.
