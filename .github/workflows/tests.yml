name: Tests

# Runs every suite in the repository on every change that could affect them.
#
# Until this existed, nothing ran any test automatically: the backend and
# frontend Vitest suites and the bash installer suites executed only when
# someone remembered. Two regressions reached main that way and were found by
# hand on real installs (#322, and the .env.example newline bug). (#333)
#
# Triggers cover both merge paths. Feature branches MERGE into dev rather than
# arriving by PR, so a pull_request-only trigger would never see them; push to
# dev catches those.
on:
  # Every branch, not just main and dev. Restricting push to those two would
  # mean a feature branch got no CI until merge time - which is exactly when it
  # is most expensive to discover a failure.
  push:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # Keyed on the source branch so a push and its pull_request share a group and
  # the superseded run is cancelled instead of running twice.
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck separately from tests: Vitest transpiles without type
      # checking, so a type error can pass the suite and still break the build.
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: backend

      - name: Test
        run: npx vitest run
        working-directory: backend

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Test
        run: npx vitest run
        working-directory: frontend

      # react/react-dom are externalised by the library build, so declaring them
      # as `dependencies` ships a second React into every consumer. That blocked
      # EasyMap 3's React 18 -> 19 upgrade and was found as "Invalid hook call"
      # in a browser, not by CI. One `npm install react` undoes the fix silently.
      - name: react is a peer dependency, not a dependency
        run: bash scripts/__tests__/react_is_a_peer_dep.test.sh
        working-directory: frontend

  frontend-react19:
    name: Frontend on React 19 (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # THE DECLARATION MUST AGREE AT THE ROOT AND THE WORKSPACE.
      #
      # Setting react only in the frontend leaves npm hoisting a peer-satisfying
      # copy to the workspace root (it marks it `peer: true` in the lockfile) and
      # nesting the new one beneath it. @testing-library/react, hoisted at the
      # root, then binds the OTHER copy: elements from one React rendered by
      # another, "Objects are not valid as a React child", and 368 failures that
      # have nothing to do with React 19. Measured 2026-10-27.
      #
      # The check that matters is what the HARNESS resolves, asserted below —
      # not the root version, which was misleading in every wrong run.
      - name: Declare React 19 in both manifests
        run: |
          npm pkg set devDependencies.react="^19.0.0" devDependencies.react-dom="^19.0.0"
          npm pkg set devDependencies.react="^19.0.0" devDependencies.react-dom="^19.0.0" \
            devDependencies.@types/react="^19.3.0" devDependencies.@types/react-dom="^19.3.0" \
            --workspace @nomad/frontend
          rm -f package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Assert ONE React, and that the test harness sees it
        run: |
          node -e "
            const path = require.resolve('react', { paths: [require.resolve('@testing-library/react')] });
            const version = require(path.replace(/index\.js$/, 'package.json')).version;
            console.log('harness resolves react', version, 'from', path);
            if (!version.startsWith('19.')) {
              throw new Error('harness resolved react ' + version + ', not 19 — the tree is split and any result below is meaningless');
            }
          "
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Test
        run: npx vitest run
        working-directory: frontend

      # build:lib is deliberately NOT run here. On @types/react@19 the dts step
      # fails with `[vite:dts] Internal Error: Unable to follow symbol for "JSX"`
      # from @microsoft/api-extractor — the React 19 JSX-namespace move, which
      # api-extractor cannot follow. The published artifact is built on React 18,
      # where it succeeds. Stated rather than left as an absence, so nobody reads
      # this job as proving the library BUILDS on 19. It does not.

  scripts:
    name: Installer suites (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # These suites had no runner at all - not an npm script, not a workflow.
      # They are plain bash 3.x-compatible and self-contained, each exiting
      # non-zero on failure.
      - name: Run bash test suites
        run: |
          set -u
          failed=0
          for suite in scripts/__tests__/*.test.sh; do
            echo "── $(basename "$suite") ─────────────────────────────"
            if bash "$suite"; then
              echo "PASS: $(basename "$suite")"
            else
              echo "FAIL: $(basename "$suite")"
              failed=$((failed + 1))
            fi
            echo ""
          done
          # Run every suite before failing, so one broken suite does not hide
          # the state of the others.
          if [ "$failed" -gt 0 ]; then
            echo "$failed suite(s) failed"
            exit 1
          fi
          echo "All installer suites passed"

      # Syntax-check the installers themselves. A script that does not parse is
      # a broken install, and these are not otherwise exercised anywhere.
      - name: Syntax-check installers
        run: |
          set -u
          failed=0
          for script in scripts/*.sh; do
            if ! bash -n "$script"; then
              echo "SYNTAX ERROR: $script"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "$failed script(s) have syntax errors"
            exit 1
          fi
          echo "All installer scripts parse"

  # Single required check to point branch protection at, so adding or renaming
  # a job later does not silently leave the gate unprotected.
  all-tests:
    name: All tests
    runs-on: ubuntu-latest
    needs: [backend, frontend, frontend-react19, scripts]
    if: always()
    steps:
      - name: Verify every suite passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more test jobs did not pass"
            exit 1
          fi
          echo "All test jobs passed"
