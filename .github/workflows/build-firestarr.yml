name: Build FireSTARR

on:
  workflow_dispatch:
    inputs:
      firestarr_version:
        description: 'FireSTARR release version'
        default: 'v0.9.5.7'
        type: string
      docker:
        description: 'Build and push Docker images'
        type: boolean
        default: true

jobs:
  build-docker-amd64:
    if: ${{ inputs.docker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Nomad (for Dockerfile)
        uses: actions/checkout@v5

      - name: Download FireSTARR release
        run: |
          VERSION="${{ inputs.firestarr_version }}"
          echo "Downloading FireSTARR $VERSION"

          mkdir -p docker-context
          cd docker-context

          # Download Linux x64 binary from CWFMF release
          curl -L -o firestarr.tar.gz \
            "https://github.com/CWFMF/firestarr-cpp/releases/download/${VERSION}/firestarr-ubuntu-x64-gcc-Release.tar.gz"

          tar -xzf firestarr.tar.gz
          chmod +x firestarr
          echo "$VERSION" > VERSION

          # Bake the raster root into the image (#515). The upstream tarball ships a
          # RELATIVE RASTER_ROOT, and this used to be rewritten per run by a /bin/sh
          # entrypoint in docker-compose.yaml — which made docker mode require a shell
          # inside whatever FIRESTARR_IMAGE names. Writing it at build time removes that
          # requirement and the per-run sed with it.
          #
          # Fails loudly rather than silently shipping a relative path: an image whose
          # raster root is wrong finds no fuel or elevation data at run time, and that is
          # far harder to diagnose than a failed build.
          if [ ! -f settings.ini ]; then
            echo "::error::settings.ini missing from the FireSTARR tarball — cannot bake RASTER_ROOT"
            exit 1
          fi
          sed -i 's|RASTER_ROOT.*|RASTER_ROOT = /appl/data/generated/grid/100m|' settings.ini
          grep -q '^RASTER_ROOT = /appl/data/generated/grid/100m$' settings.ini || {
            echo "::error::RASTER_ROOT was not baked into settings.ini"
            exit 1
          }
          echo "baked: $(grep '^RASTER_ROOT' settings.ini)"

          echo "=== Contents ==="
          ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker/firestarr/Dockerfile
          push: true
          platforms: linux/amd64
          # Attach an SPDX SBOM attestation to the pushed image (#460).
          #
          # These images already carried an attestation — SLSA provenance v0.2,
          # which build-push-action adds by default — but `imagetools inspect
          # --format '{{json .SBOM}}'` returned `{}`, so nothing described the
          # contents. Checked on the real pushed image rather than assumed.
          #
          # BuildKit runs the scan itself, so this needs no extra tool, no
          # syft pull and no export. The registry then carries the document
          # alongside the image, which is what makes it readable later by
          # anyone with pull access — unlike the deploy-time bill, which only
          # ever exists on the box that built it.
          sbom: true
          tags: |
            ghcr.io/wise-developers/project_nomad/firestarr:${{ inputs.firestarr_version }}-amd64
            ghcr.io/wise-developers/project_nomad/firestarr:${{ inputs.firestarr_version }}

  build-docker-arm64:
    if: ${{ inputs.docker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Nomad (for Dockerfile)
        uses: actions/checkout@v5

      - name: Download FireSTARR release
        run: |
          VERSION="${{ inputs.firestarr_version }}"
          URL="https://github.com/CWFMF/firestarr-cpp/releases/download/${VERSION}/firestarr-ubuntu-arm64-gcc-Release.tar.gz"
          echo "Downloading FireSTARR ARM64 $VERSION from $URL"

          mkdir -p docker-context
          cd docker-context

          if ! curl -f -L -o firestarr.tar.gz "$URL"; then
            echo "::error::ARM64 binary not found in release $VERSION"
            exit 1
          fi

          tar -xzf firestarr.tar.gz
          chmod +x firestarr
          echo "$VERSION" > VERSION

          # Same bake as the amd64 job above (#515). Both jobs build an image that compose
          # no longer rewrites at run time, so both must bake it — a fix applied to one
          # architecture is not applied to the other.
          if [ ! -f settings.ini ]; then
            echo "::error::settings.ini missing from the FireSTARR tarball — cannot bake RASTER_ROOT"
            exit 1
          fi
          sed -i 's|RASTER_ROOT.*|RASTER_ROOT = /appl/data/generated/grid/100m|' settings.ini
          grep -q '^RASTER_ROOT = /appl/data/generated/grid/100m$' settings.ini || {
            echo "::error::RASTER_ROOT was not baked into settings.ini"
            exit 1
          }
          echo "baked: $(grep '^RASTER_ROOT' settings.ini)"

          ls -la

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker/firestarr/Dockerfile
          push: true
          platforms: linux/arm64
          # As above (#460). Both architectures need it: the attestation is
          # per-manifest, so setting it on amd64 alone would describe half the
          # images and look complete in the index.
          sbom: true
          tags: |
            ghcr.io/wise-developers/project_nomad/firestarr:${{ inputs.firestarr_version }}-arm64
